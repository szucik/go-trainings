# =============================================================================
# nginx.conf — OpenResty z AWS ALB-style Connection Logging
# =============================================================================
# Struktura plików:
#   /etc/nginx/nginx.conf              <- ten plik
#   /etc/nginx/lua/connection_log.lua  <- moduł Lua
#   /etc/nginx/certs/server.crt        <- certyfikat serwera
#   /etc/nginx/certs/server.key        <- klucz prywatny serwera
#   /etc/nginx/certs/ca-bundle.pem     <- CA bundle do weryfikacji klientów (mTLS)
#   /var/log/nginx/connection.log      <- plik z logami
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # Mapowanie $connection_requests na zmienną boolowską
    # Loguj TYLKO pierwszy request na każdym TCP connection (Keep-Alive)
    # connection_requests == 1 → nowe połączenie
    # -------------------------------------------------------------------------
    map $connection_requests $is_first_request {
        1       1;
        default 0;
    }

    # -------------------------------------------------------------------------
    # Shared memory dla TLS timing
    # Klucz: "ip:port" — wartość: timestamp (ngx.now()) początku TLS handshake
    # 10m wystarczy na ~80k równoczesnych połączeń
    # -------------------------------------------------------------------------
    lua_shared_dict tls_timing 10m;

    # -------------------------------------------------------------------------
    # Ścieżka do modułów Lua
    # -------------------------------------------------------------------------
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # -------------------------------------------------------------------------
    # Zmienna do przekazania JSON z log_by_lua_block do log_format
    # Musi być zadeklarowana globalnie żeby była dostępna w log_format
    # -------------------------------------------------------------------------
    # Uwaga: log_format nie może bezpośrednio użyć zmiennej ustawionej
    # w log_by_lua_block, bo log_format jest ewaluowany PO lua bloku.
    # Dlatego używamy osobnych zmiennych per pole.

    # -------------------------------------------------------------------------
    # Format logu zgodny z AWS ALB Connection Log
    # Dokumentacja pól: https://docs.aws.amazon.com/elasticloadbalancing/
    #                   latest/application/load-balancer-connection-logs.html
    #
    # Kolejność pól identyczna jak w AWS:
    #   (1)  timestamp
    #   (2)  client_ip
    #   (3)  client_port
    #   (4)  listener_port
    #   (5)  tls_protocol
    #   (6)  tls_cipher
    #   (7)  tls_handshake_latency
    #   (8)  leaf_client_cert_subject
    #   (9)  leaf_client_cert_validity
    #   (10) leaf_client_cert_serial_number
    #   (11) tls_verify_status
    #   (12) conn_trace_id
    # -------------------------------------------------------------------------
    log_format alb_connection_log escape=none
        '$time_iso8601 '
        '$remote_addr '
        '$remote_port '
        '$server_port '
        '$ssl_protocol '
        '$ssl_cipher '
        '$conn_tls_handshake_latency '
        '"$conn_leaf_cert_subject" '
        '$conn_leaf_cert_validity '
        '$conn_leaf_cert_serial '
        '$conn_tls_verify_status '
        'TID_$connection';

    # -------------------------------------------------------------------------
    # Alternatywny format JSON — łatwiejszy do parsowania przez Athena/Splunk
    # -------------------------------------------------------------------------
    log_format alb_connection_log_json escape=none
        '{'
            '"timestamp":"$time_iso8601",'
            '"client_ip":"$remote_addr",'
            '"client_port":"$remote_port",'
            '"listener_port":"$server_port",'
            '"tls_protocol":"$ssl_protocol",'
            '"tls_cipher":"$ssl_cipher",'
            '"tls_handshake_latency":"$conn_tls_handshake_latency",'
            '"leaf_client_cert_subject":"$conn_leaf_cert_subject",'
            '"leaf_client_cert_validity":"$conn_leaf_cert_validity",'
            '"leaf_client_cert_serial":"$conn_leaf_cert_serial",'
            '"tls_verify_status":"$conn_tls_verify_status",'
            '"conn_trace_id":"TID_$connection"'
        '}';

    # -------------------------------------------------------------------------
    # Domyślne ustawienia SSL
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # Server: HTTPS z mTLS i connection logiem
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        # Certyfikat serwera
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # mTLS — CA bundle do weryfikacji certyfikatu klienta
        # Jeśli nie używasz mTLS, zakomentuj poniższe dwie linie
        ssl_client_certificate /etc/nginx/certs/ca-bundle.pem;
        ssl_verify_client on;
        # ssl_verify_client optional;    # klient może nie podać certu
        # ssl_verify_client optional_no_ca;  # tylko passthrough, bez weryfikacji

        # Głębokość łańcucha certyfikatów klienta
        ssl_verify_depth 4;

        # ---------------------------------------------------------------
        # Deklaracje zmiennych używanych przez log_format
        # Muszą być zadeklarowane przez "set" żeby istniały jako zmienne
        # nginx — log_by_lua_block może je wtedy nadpisać
        # ---------------------------------------------------------------
        set $conn_tls_handshake_latency "-";
        set $conn_leaf_cert_subject     "-";
        set $conn_leaf_cert_validity    "-";
        set $conn_leaf_cert_serial      "-";
        set $conn_tls_verify_status     "-";

        # ---------------------------------------------------------------
        # Faza SSL certificate — zapisujemy timestamp początku handshake
        # Ten blok wykonuje się podczas TLS handshake, przed HTTP
        # ---------------------------------------------------------------
        ssl_certificate_by_lua_block {
            local conn_log = require "connection_log"
            conn_log.ssl_certificate_phase()
        }

        # ---------------------------------------------------------------
        # Plik logu — używamy formatu space-separated jak AWS
        # if=$is_first_request — loguj TYLKO pierwszy request na connection
        # (Connection logs, nie request logs — jeden wpis na TCP connection)
        # ---------------------------------------------------------------
        access_log /var/log/nginx/connection.log alb_connection_log if=$is_first_request;

        # ---------------------------------------------------------------
        # Faza logowania — obliczamy latency i mapujemy pola
        # ---------------------------------------------------------------
        log_by_lua_block {
            local conn_log = require "connection_log"
            conn_log.log_phase()
        }

        # ---------------------------------------------------------------
        # Lokalizacja — przykładowy proxy do backendu
        # ---------------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Przekaż informacje o certyfikacie klienta do backendu
            # (odpowiednik nagłówków X-Amzn-Mtls-* z ALB)
            proxy_set_header X-Amzn-Mtls-Clientcert-Subject     $ssl_client_s_dn;
            proxy_set_header X-Amzn-Mtls-Clientcert-Validity    $conn_leaf_cert_validity;
            proxy_set_header X-Amzn-Mtls-Clientcert-Serial      $ssl_client_serial;
            proxy_set_header X-Amzn-Mtls-Clientcert-Verify      $conn_tls_verify_status;
        }
    }

    # -------------------------------------------------------------------------
    # Server: HTTP redirect do HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }
}
