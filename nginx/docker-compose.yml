services:
  # Prosty backend HTTP na porcie 8080 — cel proxy_pass w nginx.conf
  backend:
    image: python:3.12-alpine
    command: python3 -m http.server 8080
    network_mode: host
    restart: unless-stopped

  openresty:
    image: openresty/openresty:alpine
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./connection_log.lua:/etc/nginx/lua/connection_log.lua:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped
