worker_processes  1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events { worker_connections 1024; }

http {
    lua_shared_dict tls_timing 10m;
    lua_package_path "/home/stanczyk/projekty/go-trainings/openresty_test/lua/?.lua;;";

    log_format alb_connection_log escape=none
        '$time_iso8601 '
        '$remote_addr '
        '$remote_port '
        '$server_port '
        '$ssl_protocol '
        '$ssl_cipher '
        '$conn_tls_handshake_latency '
        '"$conn_leaf_cert_subject" '
        '$conn_leaf_cert_validity '
        '$conn_leaf_cert_serial '
        '$conn_tls_verify_status '
        'TID_$connection';

    log_format alb_connection_log_json escape=none
        '{'
            '"timestamp":"$time_iso8601",'
            '"client_ip":"$remote_addr",'
            '"client_port":"$remote_port",'
            '"listener_port":"$server_port",'
            '"tls_protocol":"$ssl_protocol",'
            '"tls_cipher":"$ssl_cipher",'
            '"tls_handshake_latency":"$conn_tls_handshake_latency",'
            '"leaf_client_cert_subject":"$conn_leaf_cert_subject",'
            '"leaf_client_cert_validity":"$conn_leaf_cert_validity",'
            '"leaf_client_cert_serial":"$conn_leaf_cert_serial",'
            '"tls_verify_status":"$conn_tls_verify_status",'
            '"conn_trace_id":"TID_$connection"'
        '}';

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;

        # mTLS disabled for local test to avoid client cert requirement
        # ssl_client_certificate certs/ca-bundle.pem;
        # ssl_verify_client on;

        set $conn_tls_handshake_latency "-";
        set $conn_leaf_cert_subject     "-";
        set $conn_leaf_cert_validity    "-";
        set $conn_leaf_cert_serial      "-";
        set $conn_tls_verify_status     "-";

        ssl_certificate_by_lua_block {
            local conn_log = require "connection_log"
            conn_log.ssl_certificate_phase()
        }

        access_log logs/connection.log alb_connection_log;

        log_by_lua_block {
            local conn_log = require "connection_log"
            conn_log.log_phase()
        }

        location / {
            default_type text/plain;
            return 200 'ok';
        }
    }

    server { listen 8080; return 301 https://$host$request_uri; }
}
