


# jaeger-all-in-one:4317

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-all-in-one
  namespace: observability
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: jaeger-agent-compact
      port: 6831
      protocol: UDP
      targetPort: 6831
    - name: jaeger-agent-binary
      port: 6832
      protocol: UDP
      targetPort: 6832
    - name: jaeger-agent-configs
      port: 5778
      protocol: TCP
      targetPort: 5778
    - name: jaeger-collector-http
      port: 14268
      protocol: TCP
      targetPort: 14268
    - name: jaeger-collector-grpc
      port: 14250
      protocol: TCP
      targetPort: 14250
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318
    - name: jaeger-query-http
      port: 16686
      protocol: TCP
      targetPort: 16686
    - name: jaeger-admin-http
      port: 14269
      protocol: TCP
      targetPort: 14269
  selector:
    app: jaeger

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-all-in-one
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.52
        ports:
        - containerPort: 6831
          protocol: UDP
          name: jg-agent-comp
        - containerPort: 6832
          protocol: UDP
          name: jg-agent-bin
        - containerPort: 5778
          protocol: TCP
          name: jg-agent-conf
        - containerPort: 14268
          protocol: TCP
          name: jg-coll-http
        - containerPort: 14250
          protocol: TCP
          name: jg-coll-grpc
        - containerPort: 4317
          protocol: TCP
          name: otlp-grpc
        - containerPort: 4318
          protocol: TCP
          name: otlp-http
        - containerPort: 16686
          protocol: TCP
          name: jg-query-http
        - containerPort: 14269
          protocol: TCP
          name: jg-admin-http
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: "memory"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
  labels:
    app: jaeger
spec:
  type: NodePort
  ports:
    - name: jaeger-query-http
      port: 16686
      targetPort: 16686
      nodePort: 30686
  selector:
    app: jaeger